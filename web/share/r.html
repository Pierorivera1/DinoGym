<!doctype html>
<!--
  The public page of a shared routine or program (task 23, decision 98).
  Served by CloudFront for every /r/<id> path. Terraform fills in the app's
  package name for this environment (infra/modules/dinogym/web.tf); r.js reads
  the share from /shares/<id> on the same origin and builds the page.
  Plain HTML, CSS and JavaScript with no build step and no libraries.
-->
<html lang="en" data-package="${package}" data-releases="${releases_url}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>DinoGym</title>
<link rel="icon" href="/web/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/web/r.css">
<script src="/web/r.js" defer></script>
</head>
<body>
<main id="app" aria-live="polite">
  <header class="brand">
    <svg class="cursor" viewBox="0 0 8 8" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true">
      <path class="cur-y" d="M2 1h4v1h-4zM1 2h6v1h-6zM1 3h1v1h-1zM3 3h2v1h-2zM6 3h1v1h-1zM1 4h6v1h-6zM1 5h2v1h-2zM5 5h2v1h-2zM2 6h4v1h-4z"/>
      <path class="cur-o" d="M2 0h4v1h-4zM1 1h1v1h-1zM6 1h1v1h-1zM0 2h1v1h-1zM7 2h1v1h-1zM0 3h1v1h-1zM2 3h1v1h-1zM5 3h1v1h-1zM7 3h1v1h-1zM0 4h1v1h-1zM7 4h1v1h-1zM0 5h1v1h-1zM3 5h2v1h-2zM7 5h1v1h-1zM1 6h1v1h-1zM6 6h1v1h-1zM2 7h4v1h-4z"/>
    </svg>
    <span class="wordmark">DINOGYM</span>
  </header>
  <p class="status" id="status">…</p>
  <noscript><p class="status">DinoGym needs JavaScript to show this routine.</p></noscript>
</main>
</body>
</html>
