openapi: 3.0.3
info:
  title: DinoGym API
  version: 0.1.0
  description: |
    The contract between the DinoGym Android app and the Go backend (decision 60).
    The Kotlin client and the Go server interfaces are generated from this file;
    change the API here first.

    Conventions:
    - Times are epoch milliseconds (int64), the same as the app's Room database.
    - Row ids are UUID strings written by the device (decision 36). A preference
      is keyed by its name instead.
    - Sync follows decision 51: whole rows, newest `updatedAt` wins, deletions are
      rows with `deletedAt` set, and devices pull by a server change number.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.invalid
    description: Placeholder. The real API Gateway URL is set per environment by the app's build.

security:
  - bearerAuth: []

tags:
  - name: health
    description: Liveness of the API.
  - name: auth
    description: Sign-in with Google and session tokens (task 20).
  - name: sync
    description: Push and pull of the user's rows (decision 51, task 21).

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the API is up
      tags: [health]
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/google:
    post:
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for a DinoGym session
      description: |
        The backend verifies the Google ID token, finds or creates the user for its
        `sub` claim, and issues its own session (decision 10). The token formats are
        settled in task 20.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Get a new access token with a refresh token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new session. The old refresh token stops working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/push:
    post:
      operationId: pushChanges
      summary: Send the rows this device changed
      description: |
        The server stores each row only if its `updatedAt` is newer than the stored
        row's; on equal `updatedAt` a deletion wins. Every stored row gets the next
        change number for the user. A row whose `updatedAt` is more than a few
        minutes in the server's future is refused. Sending the same rows again
        changes nothing, so a retry is safe.

        At most 500 rows in total per request; the server answers 400 with code
        `too_many_rows` above that.
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSet"
      responses:
        "200":
          description: One result per pushed row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/pull:
    get:
      operationId: pullChanges
      summary: Get every row stored after a change number
      description: |
        Returns the user's rows with a change number greater than `since`, in
        change-number order, at most `limit` of them. The device stores `cursor`
        and passes it as `since` next time. While `hasMore` is true, pull again.
        Applying the same row twice changes nothing.
      tags: [sync]
      parameters:
        - name: since
          in: query
          required: true
          description: The last change number this device has applied; 0 on first sync.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: The most rows to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: The rows after `since`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The access token from `Session`.

  responses:
    BadRequest:
      description: The request is malformed or breaks a limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A stable, machine-readable code such as `invalid_token` or `too_many_rows`.
          example: invalid_token
        message:
          type: string
          description: A human-readable explanation, in English, for logs. Not shown to the user.

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          minLength: 1
          description: The Google ID token from Android Credential Manager.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1

    Session:
      type: object
      required: [userId, accessToken, accessTokenExpiresAt, refreshToken]
      properties:
        userId:
          type: string
          description: The DinoGym user id (decision 52), not the Google `sub`.
        accessToken:
          type: string
          description: "Sent as `Authorization: Bearer <accessToken>`."
        accessTokenExpiresAt:
          type: integer
          format: int64
          description: When the access token expires, epoch milliseconds.
        refreshToken:
          type: string
          description: Single use. Stored on the device and exchanged at `/auth/refresh`.

    ChangeSet:
      type: object
      description: |
        Rows grouped by table. Every list may be empty or left out. A deleted row
        is sent whole, with `deletedAt` set.
      properties:
        programs:
          type: array
          items:
            $ref: "#/components/schemas/Program"
        cycleSteps:
          type: array
          items:
            $ref: "#/components/schemas/CycleStep"
        routines:
          type: array
          items:
            $ref: "#/components/schemas/Routine"
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        routineExercises:
          type: array
          items:
            $ref: "#/components/schemas/RoutineExercise"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutSession"
        setEntries:
          type: array
          items:
            $ref: "#/components/schemas/SetEntry"
        weighIns:
          type: array
          items:
            $ref: "#/components/schemas/WeighIn"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Preference"

    PushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PushResult"

    PushResult:
      type: object
      required: [table, id, status]
      properties:
        table:
          $ref: "#/components/schemas/SyncTable"
        id:
          type: string
          description: The row's id, or the key for a preference.
        status:
          type: string
          description: |
            - `accepted`: stored, with `changeNumber`.
            - `stale`: the server already has a row at least as new; it arrives on the next pull.
            - `rejected`: refused, for example an `updatedAt` too far in the future. See `reason`.
          enum: [accepted, stale, rejected]
        changeNumber:
          type: integer
          format: int64
          description: Set when `status` is `accepted`.
        reason:
          type: string
          description: Set when `status` is `rejected`, a stable code such as `updated_at_in_future`.

    PullResponse:
      type: object
      required: [changes, cursor, hasMore]
      properties:
        changes:
          $ref: "#/components/schemas/ChangeSet"
        cursor:
          type: integer
          format: int64
          description: The highest change number in this page, or `since` when the page is empty.
        hasMore:
          type: boolean
          description: True when more rows follow this page.

    SyncTable:
      type: string
      description: The table a row belongs to, named as in the app's database.
      enum:
        - program
        - cycle_step
        - routine
        - exercise
        - routine_exercise
        - session
        - set_entry
        - weigh_in
        - preference

    # Rows. They mirror the app's Room tables (ARCHITECTURE.md, "Data model").
    # `local_flag` and the theme never sync.

    RowId:
      type: string
      description: A UUID written by the device.
      minLength: 36
      maxLength: 36

    UpdatedAt:
      type: integer
      format: int64
      description: When the row was last changed on a device, epoch milliseconds.

    DeletedAt:
      type: integer
      format: int64
      nullable: true
      description: When the row was deleted, epoch milliseconds. Null while it exists.

    Program:
      type: object
      required: [id, name, type, currentStep, isActive, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/RowId"
        name:
          type: string
        type:
          type: string
          enum: [GYM, CALISTHENICS]
        currentStep:
          type: integer
          format: int32
          minimum: 0
        isActive:
          type: boolean
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"

    CycleStep:
      type: object
      required: [id, programId, position, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/RowId"
        programId:
          $ref: "#/components/schemas/RowId"
        position:
          type: integer
          format: int32
          minimum: 0
        routineId:
          type: string
          nullable: true
          description: The routine for this day; null is a rest day.
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"

    Routine:
      type: object
      required: [id, name, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/RowId"
        name:
          type: string
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"

    Exercise:
      type: object
      required: [id, name, iconKey, kind, weightEnabled, archived, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/RowId"
        name:
          type: string
        iconKey:
          type: string
        kind:
          type: string
          enum: [REPS, TEMPLATE, SHOW_ONLY]
        template:
          type: string
          nullable: true
          description: For `TEMPLATE` exercises, for example `3s + {n} pulls + 3s`.
        weightEnabled:
          type: boolean
        archived:
          type: boolean
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"

    RoutineExercise:
      type: object
      required: [id, routineId, exerciseId, position, sets, repMin, repMax, restSeconds, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/RowId"
        routineId:
          $ref: "#/components/schemas/RowId"
        exerciseId:
          $ref: "#/components/schemas/RowId"
        position:
          type: integer
          format: int32
          minimum: 0
        sets:
          type: integer
          format: int32
          minimum: 1
        repMin:
          type: integer
          format: int32
          minimum: 0
        repMax:
          type: integer
          format: int32
          minimum: 0
        restSeconds:
          type: integer
          format: int32
          minimum: 0
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"

    WorkoutSession:
      type: object
      description: A workout, the app's `session` table. Named so it is not confused with a sign-in `Session`.
      required: [id, routineId, programId, startedAt, currentPosition, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/RowId"
        routineId:
          $ref: "#/components/schemas/RowId"
        programId:
          $ref: "#/components/schemas/RowId"
        startedAt:
          type: integer
          format: int64
        endedAt:
          type: integer
          format: int64
          nullable: true
          description: Null while the workout is in progress.
        currentPosition:
          type: integer
          format: int32
          minimum: 0
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"

    SetEntry:
      type: object
      required: [id, sessionId, exerciseId, setIndex, reps, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/RowId"
        sessionId:
          $ref: "#/components/schemas/RowId"
        exerciseId:
          $ref: "#/components/schemas/RowId"
        setIndex:
          type: integer
          format: int32
          minimum: 1
          description: 1-based.
        reps:
          type: integer
          format: int32
          minimum: 0
        weightKg:
          type: number
          format: double
          nullable: true
        note:
          type: string
          nullable: true
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"

    WeighIn:
      type: object
      required: [id, measuredAt, weightKg, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/RowId"
        measuredAt:
          type: integer
          format: int64
        weightKg:
          type: number
          format: double
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"

    Preference:
      type: object
      description: A setting that follows the account. Keyed by name; clearing it is a soft delete.
      required: [key, value, updatedAt]
      properties:
        key:
          type: string
          minLength: 1
        value:
          type: string
        updatedAt:
          $ref: "#/components/schemas/UpdatedAt"
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"
