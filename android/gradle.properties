# CPU and memory limits for this laptop (CLAUDE.md "Do not overheat the laptop", decision 15).
# Do not raise these. They also apply when the project is opened in Android Studio.
org.gradle.workers.max=3
org.gradle.parallel=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

# Reuse outputs from earlier builds instead of recompiling. Saves CPU, costs only disk.
org.gradle.caching=true

# Standard Android settings.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
