<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 900px; height: 960px; box-sizing: border-box; background: #E4E0EA; padding: 40px; display: flex; gap: 40px; font-family: Inter, sans-serif">
  <sc-for list="{{vs}}" as="v" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #3B3447">{{v.label}}</div>
      <div style="width: 390px; height: 844px; box-sizing: border-box; background: {{v.t.bg}}; color: {{v.t.outline}}; display: flex; flex-direction: column; overflow: hidden">
        <div style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 16px">
          <header style="height: 56px; display: flex; align-items: center; justify-content: space-between">
            <h1 style="margin: 0; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 26px">DINOGYM</h1>
            <span style="font-size: 14px; color: {{v.t.muted}}">{{v.s.date}}</span>
          </header>

          <div style="filter: drop-shadow(4px 4px 0 {{v.t.shadow}})">
            <div style="background: {{v.t.bg}}; border: 3px solid {{v.t.outline}}; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
              <img src="/_blob/302248974e46a4c504c80e111541b3ef" alt="" width="48" height="48" style="image-rendering: pixelated; flex-shrink: 0">
              <p style="margin: 0; font-size: 15px; line-height: 1.45">{{v.s.bubble}}</p>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">
              <span>{{v.s.upNext}}</span><span>{{v.s.program}}</span>
            </div>
            <div style="background: {{v.t.surface}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; align-items: flex-start; justify-content: space-between">
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <h2 style="margin: 0; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 40px; line-height: 1">PULL</h2>
                  <span style="font-size: 14px; color: {{v.t.muted}}">{{v.s.meta}}</span>
                </div>
                <button type="button" aria-label="{{v.s.editAria}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{v.t.surface2}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; cursor: pointer"><svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.edit}}" fill="{{v.t.outline}}"></path></svg></button>
              </div>
              <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
                <sc-for list="{{v.s.rows}}" as="r" hint-placeholder-count="6">
                  <li style="display: flex; justify-content: space-between; align-items: center; height: 30px; border-top: 2px dotted {{v.t.surface2}}; font-size: 15px">
                    <span>{{r.name}}</span><span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 500; font-size: 15px; color: {{v.t.muted}}">{{r.target}}</span>
                  </li>
                </sc-for>
              </ul>
              <div style="display: flex; gap: 10px">
                <button type="button" style="flex-grow: 1; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; background: {{v.t.primary}}; color: {{v.t.onPrimary}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer">
                  <svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.start}}" fill="{{v.t.onPrimary}}"></path></svg>{{v.s.startBtn}}
                </button>
                <button type="button" style="width: 104px; height: 56px; background: {{v.t.surface}}; color: {{v.t.outline}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer">{{v.s.skip}}</button>
              </div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.cycle}}</div>
            <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
              <sc-for list="{{v.cycle}}" as="c" hint-placeholder-count="6">
                <li style="height: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}; clip-path: {{n}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 12px">
                  <sc-if value="{{c.cur}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><path d="{{cur.y}}" fill="#F5D23A"></path><path d="{{cur.o}}" fill="#33213F"></path></svg></sc-if>
                  <span>{{c.label}}</span>
                </li>
              </sc-for>
            </ol>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: {{v.t.surface}}; border: 2px solid {{v.t.surface2}}; font-size: 14px">
            <span><span style="color: {{v.t.muted}}">{{v.s.lastLabel}}</span> {{v.s.last}}</span>
            <svg viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.start}}" fill="{{v.t.muted}}"></path></svg>
          </div>
        </div>

        <nav aria-label="Main" style="background: {{v.t.surface}}; border-top: 2px solid {{v.t.outline}}; padding: 8px 6px 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; align-items: end">
          <sc-for list="{{v.tabs}}" as="tab" hint-placeholder-count="5">
            <a href="#" aria-current="{{tab.current}}" style="height: {{tab.h}}; margin-top: {{tab.mt}}; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; background: {{tab.bg}}; color: {{tab.fg}}; border: 2px solid {{tab.border}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}">
              <sc-if value="{{tab.sel}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 8 8" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{cur.y}}" fill="#F5D23A"></path><path d="{{cur.o}}" fill="#33213F"></path></svg></sc-if>
              <sc-if value="{{tab.notSel}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{tab.icon}}" fill="{{tab.fg}}"></path></svg></sc-if>
              <span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 11px; line-height: 1; white-space: nowrap">{{tab.label}}</span>
            </a>
          </sc-for>
        </nav>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["EN + ES","EN","ES"],"default":"EN + ES"},"$preview":{"width":900,"height":960}}'>
const T = {
  night: { name: 'NIGHT', bg: '#0C0915', surface: '#1C1430', surface2: '#2A1F45', outline: '#F4F2F7', muted: '#A39BB6', primary: '#A98BFF', onPrimary: '#0C0915', select: '#F5D23A', onSelect: '#0C0915', action: '#F0A030', danger: '#FF4D4D', success: '#5CD27A', hi: 'rgba(255,255,255,0.22)', lo: 'rgba(0,0,0,0.45)', shadow: '#4A3A80', selBg: '#1C1430', selBorder: '#F5D23A', selText: '#F5D23A', navBorder: '#F0A030' },
  day: { name: 'DAY', bg: '#FBF3E8', surface: '#FFFDF8', surface2: '#F3E6D6', outline: '#33213F', muted: '#7A6684', primary: '#6B4FC8', onPrimary: '#FBF3E8', select: '#FBDA61', onSelect: '#33213F', action: '#33213F', danger: '#B8326A', success: '#2F7D45', hi: 'rgba(255,255,255,0.6)', lo: 'rgba(51,33,63,0.25)', shadow: '#33213F', selBg: '#FBDA61', selBorder: '#33213F', selText: '#33213F', navBorder: '#33213F' }
};
const N = 'polygon(2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 2px 2px)';
function px(rows) { let d = ''; rows.forEach(function (r, y) { for (let x = 0; x < r.length; x++) { if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; } }); return d; }
const I = {
  home: px(['','.......##','......####','.....##..##','....##....##','...##......##','..##........##','.##..........##','...#........#','...#..####..#','...#..#..#..#','...#..#..#..#','...#..#..#..#','...####..####']),
  programs: px(['','.....######','..####....####','..#..######..#','..#..........#','..#.##.#####.#','..#..........#','..#.##.#####.#','..#..........#','..#.##.#####.#','..#..........#','..#.##.###...#','..#..........#','..############']),
  start: px(['','','....#','....###','....#####','....#######','....#########','....##########','....##########','....#########','....#######','....#####','....###','....#']),
  stats: px(['','','...........##','...........##','.......##..##','.......##..##','...##..##..##','...##..##..##','...##..##..##','...##..##..##','...##..##..##','...##..##..##','.##############']),
  exercises: px(['','','','..##........##','.###........###','.###........###','.##############','.##############','.###........###','.###........###','..##........##']),
  edit: px(['','..........##','.........####','........####','.......####','......####','.....####','....####','...####','...###','...##'])
};
const CUR_O = px(['..####..', '.#....#.', '#......#', '#.#..#.#', '#......#', '#..##..#', '.#....#.', '..####..']);
const CUR_Y = px(['........', '..####..', '.######.', '.#.##.#.', '.######.', '.##..##.', '..####..', '........']);
const S = {
  en: {
    date: 'Mon 16 Nov', bubble: '* Pull day is up next. Last time you did 6 pull-ups on set 1.', upNext: 'UP NEXT', program: 'MY PROGRAM · 1 OF 6', meta: '6 exercises · 14 sets', editAria: 'Edit the Pull routine', startBtn: 'START PULL', skip: 'SKIP', cycle: 'CYCLE', lastLabel: 'Last workout:', last: 'Lower · Sat 14 Nov',
    rows: [['Front lever + pulls', '2 × 4'], ['Forearm curl', '3 × 13'], ['Pull-ups', '2 × 6'], ['Reverse curl', '2 × 25'], ['Rows', '3 × 12'], ['Bicep curl', '2 × 12']],
    tabs: ['HOME', 'PROGRAMS', 'START', 'STATS', 'EXERCISES']
  },
  es: {
    date: 'lun 16 nov', bubble: '* Hoy toca Pull. La última vez hiciste 6 dominadas en la serie 1.', upNext: 'SIGUIENTE', program: 'MI PROGRAMA · 1 DE 6', meta: '6 ejercicios · 14 series', editAria: 'Editar la rutina Pull', startBtn: 'EMPEZAR PULL', skip: 'SALTAR', cycle: 'CICLO', lastLabel: 'Último entreno:', last: 'Lower · sáb 14 nov',
    rows: [['Front lever + dominadas', '2 × 4'], ['Curl de antebrazo', '3 × 13'], ['Dominadas', '2 × 6'], ['Curl inverso', '2 × 25'], ['Remo', '3 × 12'], ['Curl de bíceps', '2 × 12']],
    tabs: ['INICIO', 'PROGRAMAS', 'EMPEZAR', 'STATS', 'EJERCICIOS']
  }
};
const CYCLE = ['PULL', 'PUSH', 'LEGS', 'ZZZ', 'UPPER', 'LOWER'];
class Component extends DCLogic {
  renderVals() {
    const L = this.props.lang ?? 'EN + ES';
    const pairs = L === 'EN' ? [['night', 'en'], ['day', 'en']] : L === 'ES' ? [['night', 'es'], ['day', 'es']] : [['night', 'en'], ['day', 'es']];
    const navIcons = [I.home, I.programs, I.start, I.stats, I.exercises];
    const vs = pairs.map(function (p) {
      const t = T[p[0]], s = S[p[1]];
      return {
        t: t,
        label: t.name + ' · ' + (p[1] === 'en' ? 'ENGLISH' : 'ESPAÑOL'),
        s: { date: s.date, bubble: s.bubble, upNext: s.upNext, program: s.program, meta: s.meta, editAria: s.editAria, startBtn: s.startBtn, skip: s.skip, cycle: s.cycle, lastLabel: s.lastLabel, last: s.last, rows: s.rows.map(function (r) { return { name: r[0], target: r[1] }; }) },
        cycle: CYCLE.map(function (c, i) { const cur = i === 0; return { label: c, cur: cur, bg: cur ? t.selBg : t.surface, fg: cur ? t.selText : (c === 'ZZZ' ? t.muted : t.outline), border: cur ? t.selBorder : t.surface2 }; }),
        tabs: s.tabs.map(function (l, i) {
          const sel = i === 0, start = i === 2;
          return { label: l, icon: navIcons[i], sel: sel, notSel: !sel, current: sel ? 'page' : 'false', h: start ? '76px' : '64px', mt: start ? '-20px' : '0', bg: start ? t.primary : (sel ? t.selBg : t.surface), fg: start ? t.onPrimary : (sel ? t.selText : t.outline), border: start ? t.outline : (sel ? t.selBorder : t.navBorder) };
        })
      };
    });
    return { vs: vs, n: N, ic: I, cur: { o: CUR_O, y: CUR_Y } };
  }
}
</script>
</body>
</html>
