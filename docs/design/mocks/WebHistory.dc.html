<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web dashboard: history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1360px; height: 960px; box-sizing: border-box; background: #E4E0EA; padding: 40px; display: flex; flex-direction: column; gap: 12px; font-family: Inter, sans-serif">
  <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #3B3447">{{label}}</div>
  <div style="width: 1280px; height: 843px; box-sizing: border-box; background: {{t.bg}}; color: {{t.outline}}; display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 32px; flex-shrink: 0; padding: 0 14px; display: flex; align-items: center; background: {{t.surface2}}; color: {{t.muted}}; font-size: 12px">d1ktti3qymlgmy.cloudfront.net/history</div>
    <div style="flex-grow: 1; padding: 0 32px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 0">

      <header style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; border-bottom: 2px dotted {{t.surface2}}">
        <svg viewBox="0 0 8 8" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{cur.y}}" fill="{{t.select}}"></path><path d="{{cur.o}}" fill="{{t.outline}}"></path></svg>
        <span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.04em">DINOGYM</span>
        <nav aria-label="{{s.navAria}}" style="display: flex; gap: 4px; margin-left: 24px">
          <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
            <a href="{{tab.href}}" aria-current="{{tab.current}}" style="height: 44px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; background: {{tab.bg}}; color: {{tab.fg}}; border: 2px solid {{tab.border}}; clip-path: {{n}}; box-shadow: {{tab.shadow}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 16px; text-decoration: none">{{tab.label}}</a>
          </sc-for>
        </nav>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 13px; color: {{t.muted}}">{{s.updated}}</span>
        <button style="height: 44px; padding: 0 14px; background: {{t.surface}}; color: {{t.outline}}; border: 2px solid {{t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{t.hi}}, inset 0 -4px 0 {{t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 15px">{{s.refresh}}</button>
        <span style="display: flex; align-items: center; gap: 8px; margin-left: 8px">
          <span aria-hidden="true" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: {{t.surface2}}; clip-path: {{n}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 18px">A</span>
          <span style="font-size: 14px; font-weight: 600">Alex M.</span>
        </span>
        <button style="height: 44px; padding: 0 14px; background: {{t.surface}}; color: {{t.outline}}; border: 2px solid {{t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{t.hi}}, inset 0 -4px 0 {{t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 15px">{{s.signOut}}</button>
      </header>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) 372px; gap: 12px; flex-shrink: 0">
        <sc-for list="{{panels}}" as="p" hint-placeholder-count="4">
          <div style="background: {{t.surface}}; border: 2px solid {{t.outline}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{t.hi}}, inset 0 -4px 0 {{t.lo}}; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: {{t.muted}}">{{p.k}}</span>
            <span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 36px; line-height: 1; color: {{p.c}}">{{p.v}}</span>
            <span style="font-size: 13px; color: {{t.muted}}">{{p.sub}}</span>
          </div>
        </sc-for>
        <figure style="margin: 0; background: {{t.surface}}; border: 2px solid {{t.outline}}; clip-path: {{n}}; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px">
          <figcaption style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: {{t.muted}}"><span>{{s.weeks}}</span><span>{{s.weeksSub}}</span></figcaption>
          <div role="img" aria-label="{{s.weeksAria}}" style="display: grid; grid-template-columns: repeat(18, 10px); grid-template-rows: repeat(7, 10px); grid-auto-flow: column; gap: 3px">
            <sc-for list="{{cells}}" as="c" hint-placeholder-count="126">
              <span style="width: 10px; height: 10px; box-sizing: border-box; background: {{c.bg}}; border: 2px solid {{c.border}}"></span>
            </sc-for>
          </div>
        </figure>
      </div>

      <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 20px">
        <section aria-label="{{s.listAria}}" style="display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden">
          <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{t.muted}}">{{s.month}}</div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
            <a href="#" aria-current="{{r.current}}" style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px 0 6px; display: flex; align-items: center; gap: 10px; background: {{r.bg}}; color: {{t.outline}}; border: 2px solid {{r.border}}; clip-path: {{n}}; text-decoration: none">
              <span style="width: 16px; display: flex; justify-content: center"><sc-if value="{{r.sel}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 8 8" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><path d="{{cur.y}}" fill="{{t.select}}"></path><path d="{{cur.o}}" fill="{{t.outline}}"></path></svg></sc-if></span>
              <span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{t.surface2}}; clip-path: {{n}}">
                <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: {{t.muted}}">{{r.dow}}</span>
                <span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 18px; line-height: 1">{{r.day}}</span>
              </span>
              <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 18px; color: {{r.fg}}">{{r.routine}}</span>
                <span style="font-size: 13px; color: {{t.muted}}">{{r.meta}}</span>
              </span>
              <sc-if value="{{r.hasBest}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 6px; background: {{t.select}}; color: {{t.onSelect}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 13px">{{r.best}}</span></sc-if>
            </a>
          </sc-for>
        </section>

        <article style="background: {{t.surface}}; border: 2px solid {{t.outline}}; clip-path: {{n}}; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: hidden">
          <div style="display: flex; align-items: flex-end; gap: 16px">
            <div style="flex-grow: 1">
              <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: {{t.muted}}">{{s.workout}}</div>
              <h1 style="margin: 0; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 34px; line-height: 1.1">PULL</h1>
              <div style="font-size: 15px; color: {{t.muted}}">{{s.sub}}</div>
            </div>
            <span style="padding: 4px 8px; background: {{t.select}}; color: {{t.onSelect}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 15px">{{s.bestTag}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{exs}}" as="e" hint-placeholder-count="6">
              <div style="padding: 10px 12px 12px; background: {{e.bg}}; border: 2px solid {{t.surface2}}; clip-path: {{n}}; display: flex; flex-direction: column; gap: 8px">
                <div style="display: flex; align-items: baseline; gap: 8px">
                  <a href="WebProgress.dc.html" style="font-size: 15px; font-weight: 600; color: {{t.outline}}">{{e.name}}</a>
                  <span style="font-size: 13px; color: {{e.noteC}}">{{e.note}}</span>
                </div>
                <div style="display: flex; gap: 6px">
                  <sc-for list="{{e.sets}}" as="c" hint-placeholder-count="3">
                    <span style="width: 52px; height: 48px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{t.bg}}; border: 2px solid {{c.border}}; clip-path: {{n}}">
                      <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: {{t.muted}}">{{c.k}}</span>
                      <span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px; line-height: 1">{{c.v}}</span>
                    </span>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
          <div style="font-size: 13px; color: {{t.muted}}">{{s.readOnly}}</div>
        </article>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Night · English","Day · Español"],"default":"Night · English"},"$preview":{"width":1360,"height":960}}'>
const T = {
  night: { name: 'NIGHT', bg: '#0C0915', surface: '#1C1430', surface2: '#2A1F45', outline: '#F4F2F7', muted: '#A39BB6', primary: '#A98BFF', select: '#F5D23A', onSelect: '#0C0915', action: '#F0A030', success: '#5CD27A', hi: 'rgba(255,255,255,0.22)', lo: 'rgba(0,0,0,0.45)', selBg: '#1C1430', selBorder: '#F5D23A', selText: '#F5D23A', bestBg: 'rgba(92,210,122,0.14)' },
  day: { name: 'DAY', bg: '#FBF3E8', surface: '#FFFDF8', surface2: '#F3E6D6', outline: '#33213F', muted: '#7A6684', primary: '#6B4FC8', select: '#FBDA61', onSelect: '#33213F', action: '#33213F', success: '#2F7D45', hi: 'rgba(255,255,255,0.6)', lo: 'rgba(51,33,63,0.25)', selBg: '#FBDA61', selBorder: '#33213F', selText: '#33213F', bestBg: '#E3F3E6' }
};
const N = 'polygon(2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 2px 2px)';
function px(rows) { let d = ''; rows.forEach(function (r, y) { for (let x = 0; x < r.length; x++) { if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; } }); return d; }
const CUR = { o: px(['..####..', '.#....#.', '#......#', '#.#..#.#', '#......#', '#..##..#', '.#....#.', '..####..']), y: px(['........', '..####..', '.######.', '.#.##.#.', '.######.', '.##..##.', '..####..', '........']) };
const ROWS = [['16', 'PULL', '42:10', 14, 1], ['14', 'LOWER', '31:05', 5, 0], ['13', 'UPPER', '48:30', 15, 2], ['11', 'LEGS', '29:40', 5, 0], ['10', 'PUSH', '38:15', 11, 1], ['9', 'PULL', '41:50', 14, 0], ['8', 'LOWER', '30:20', 5, 0]];
const SETS = [[3, 3], [15, 12], [7, 6, 5], [12, 10], [10, 10, 9], [10, 8]];
const S = {
  en: {
    navAria: 'Dashboard', tabs: ['HISTORY', 'PROGRESS', 'WEIGHT'], updated: 'Updated 2 min ago', refresh: 'REFRESH', signOut: 'SIGN OUT',
    panels: [['THIS WEEK', '3', 'workouts'], ['THIS MONTH', '11', 'workouts'], ['TIME THIS MONTH', '6:42', 'hours'], ['BESTS THIS MONTH', '▲ 5', 'new set 1 records']],
    weeks: 'LAST 18 WEEKS', weeksSub: 'ONE SQUARE A DAY', weeksAria: 'Workouts per day over the last 18 weeks: most weeks have four or five',
    listAria: 'Workouts', month: 'NOVEMBER 2026', dows: ['MON', 'SAT', 'FRI', 'WED', 'TUE', 'MON', 'SUN'], sets: ' sets', best1: '▲ 1 BEST', bestN: ' BESTS',
    workout: 'WORKOUT', sub: 'Monday 16 November · 42:10 · 14 sets', bestTag: '▲ 1 NEW BEST',
    names: ['Front lever + pulls', 'Forearm curl', 'Pull-ups', 'Reverse curl', 'Rows', 'Bicep curl'], notes: ['3s + {n} pulls + 3s', '', '▲ New best on set 1', '', '', ''], set: 'SET ',
    readOnly: 'The dashboard only reads. To change a set or delete a workout, open it in the app.'
  },
  es: {
    navAria: 'Panel', tabs: ['HISTORIAL', 'PROGRESO', 'PESO'], updated: 'Actualizado hace 2 min', refresh: 'ACTUALIZAR', signOut: 'CERRAR SESIÓN',
    panels: [['ESTA SEMANA', '3', 'entrenos'], ['ESTE MES', '11', 'entrenos'], ['TIEMPO ESTE MES', '6:42', 'horas'], ['RÉCORDS ESTE MES', '▲ 5', 'récords en la serie 1']],
    weeks: 'ÚLTIMAS 18 SEMANAS', weeksSub: 'UN CUADRO POR DÍA', weeksAria: 'Entrenos por día en las últimas 18 semanas: casi todas tienen cuatro o cinco',
    listAria: 'Entrenos', month: 'NOVIEMBRE 2026', dows: ['LUN', 'SÁB', 'VIE', 'MIÉ', 'MAR', 'LUN', 'DOM'], sets: ' series', best1: '▲ 1 RÉCORD', bestN: ' RÉCORDS',
    workout: 'ENTRENO', sub: 'lunes 16 de noviembre · 42:10 · 14 series', bestTag: '▲ 1 RÉCORD',
    names: ['Front lever + dominadas', 'Curl de antebrazo', 'Dominadas', 'Curl inverso', 'Remo', 'Curl de bíceps'], notes: ['3s + {n} dominadas + 3s', '', '▲ Récord en la serie 1', '', '', ''], set: 'S',
    readOnly: 'El panel solo muestra. Para cambiar una serie o borrar un entreno, ábrelo en la app.'
  }
};
class Component extends DCLogic {
  renderVals() {
    const day = (this.props.theme ?? 'Night · English') !== 'Night · English';
    const t = day ? T.day : T.night, s = day ? S.es : S.en;
    const bands = 'inset 0 2px 0 ' + t.hi + ', inset 0 -4px 0 ' + t.lo;
    const hrefs = ['WebHistory.dc.html', 'WebProgress.dc.html', 'WebWeight.dc.html'];
    const cells = [];
    for (let i = 0; i < 126; i++) {
      const on = i < 119 && [0, 1, 3, 4, 5].indexOf(i % 7) >= 0 && ((i * 5) % 13) !== 2;
      const today = i === 119;
      cells.push({ bg: on || today ? t.primary : 'transparent', border: today ? t.select : (on ? t.primary : t.surface2) });
    }
    return {
      t: t, s: s, n: N, cur: CUR,
      label: 'WEB · ' + t.name + ' · ' + (day ? 'ESPAÑOL' : 'ENGLISH') + ' · HISTORY, ONE WORKOUT OPEN',
      tabs: s.tabs.map(function (l, i) { const on = i === 0; return { label: l, href: hrefs[i], current: on ? 'page' : 'false', bg: on ? t.select : t.surface, fg: on ? t.onSelect : t.outline, border: on ? t.outline : t.action, shadow: on ? 'none' : bands }; }),
      panels: s.panels.map(function (p, i) { return { k: p[0], v: p[1], sub: p[2], c: i === 3 ? t.success : t.outline }; }),
      cells: cells,
      rows: ROWS.map(function (d, i) {
        const sel = i === 0;
        return { sel: sel, current: sel ? 'true' : 'false', bg: sel ? t.selBg : t.surface, border: sel ? t.selBorder : t.surface2, fg: sel ? t.selText : t.outline, dow: s.dows[i], day: d[0], routine: d[1], meta: d[2] + ' · ' + d[3] + s.sets, hasBest: d[4] > 0, best: d[4] === 1 ? s.best1 : '▲ ' + d[4] + s.bestN };
      }),
      exs: s.names.map(function (nm, i) {
        const best = i === 2;
        return { name: nm, note: s.notes[i], noteC: best ? t.success : t.muted, bg: best ? t.bestBg : t.surface, sets: SETS[i].map(function (v, j) { return { k: s.set + (j + 1), v: String(v), border: best && j === 0 ? t.success : t.outline }; }) };
      })
    };
  }
}
</script>
</body>
</html>
