<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 900px; height: 960px; box-sizing: border-box; background: #E4E0EA; padding: 40px; display: flex; gap: 40px; font-family: Inter, sans-serif">
  <sc-for list="{{vs}}" as="v" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #3B3447">{{v.label}}</div>
      <div style="width: 390px; height: 844px; box-sizing: border-box; background: {{v.t.bg}}; color: {{v.t.outline}}; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
        <header style="height: 56px; flex-shrink: 0; display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center">
          <a href="ExerciseLibrary.dc.html" aria-label="{{v.s.backAria}}" style="width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{v.t.surface}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.back}}" fill="{{v.t.action}}"></path></svg></a>
          <h1 style="margin: 0; text-align: center; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 22px">{{v.s.title}}</h1>
          <span></span>
        </header>

        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}"><span>{{v.s.nameLabel}}</span><span style="font-weight: 400; letter-spacing: 0">{{v.s.saves}}</span></span>
          <input type="text" value="{{v.s.name}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; background: {{v.t.bg}}; color: {{v.t.outline}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; font-family: Inter, sans-serif; font-size: 16px; outline: none">
        </label>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <span id="icon-label" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.iconLabel}}</span>
          <div role="radiogroup" aria-labelledby="icon-label" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{v.icons}}" as="i" hint-placeholder-count="10">
              <button type="button" role="radio" aria-checked="{{i.on}}" aria-label="{{i.name}}" style="height: 52px; display: flex; align-items: center; justify-content: center; background: {{i.bg}}; border: 2px solid {{i.border}}; clip-path: {{n}}; box-shadow: {{i.shadow}}; cursor: pointer"><svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{i.d}}" fill="{{i.fg}}"></path></svg></button>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <span id="kind-label" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.kindLabel}}</span>
          <div role="radiogroup" aria-labelledby="kind-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{v.kinds}}" as="sg" hint-placeholder-count="3">
              <button type="button" role="radio" aria-checked="{{sg.on}}" style="height: 48px; padding: 0 2px; background: {{sg.bg}}; color: {{sg.fg}}; border: 2px solid {{sg.border}}; clip-path: {{n}}; box-shadow: {{sg.shadow}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer">{{sg.label}}</button>
            </sc-for>
          </div>
        </div>

        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.patternLabel}}</span>
          <input type="text" value="{{v.s.pattern}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; background: {{v.t.bg}}; color: {{v.t.outline}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; font-family: Inter, sans-serif; font-size: 16px; outline: none">
          <span style="font-size: 13px; line-height: 1.4; color: {{v.t.muted}}">{{v.s.patternHelp}} <b style="font-weight: 600; color: {{v.t.outline}}">{{v.s.preview}}</b></span>
        </label>

        <div style="min-height: 64px; padding: 8px 12px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; background: {{v.t.surface}}; border: 2px solid {{v.t.surface2}}; clip-path: {{n}}">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
            <span id="weight-label" style="font-size: 15px; font-weight: 600">{{v.s.weight}}</span>
            <span style="font-size: 13px; line-height: 1.35; color: {{v.t.muted}}">{{v.s.weightHelp}}</span>
          </span>
          <button type="button" role="switch" aria-checked="false" aria-labelledby="weight-label" style="width: 64px; height: 48px; flex-shrink: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer">
            <span style="width: 60px; height: 32px; box-sizing: border-box; padding: 4px; display: flex; justify-content: flex-start; background: {{v.t.surface2}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}"><span style="width: 20px; height: 20px; background: {{v.t.outline}}"></span></span>
          </button>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
          <button type="button" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; background: {{v.t.surface}}; color: {{v.t.outline}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.archive}}" fill="{{v.t.action}}"></path></svg>{{v.s.archive}}</button>
          <span style="font-size: 13px; line-height: 1.4; color: {{v.t.muted}}">{{v.s.archiveHelp}}</span>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["EN + ES","EN","ES"],"default":"EN + ES"},"$preview":{"width":900,"height":960}}'>
const T = {
  night: { name: 'NIGHT', bg: '#0C0915', surface: '#1C1430', surface2: '#2A1F45', outline: '#F4F2F7', muted: '#A39BB6', select: '#F5D23A', onSelect: '#0C0915', action: '#F0A030', hi: 'rgba(255,255,255,0.22)', lo: 'rgba(0,0,0,0.45)', selBg: '#1C1430', selBorder: '#F5D23A', selText: '#F5D23A' },
  day: { name: 'DAY', bg: '#FBF3E8', surface: '#FFFDF8', surface2: '#F3E6D6', outline: '#33213F', muted: '#7A6684', select: '#FBDA61', onSelect: '#33213F', action: '#33213F', hi: 'rgba(255,255,255,0.6)', lo: 'rgba(51,33,63,0.25)', selBg: '#FBDA61', selBorder: '#33213F', selText: '#33213F' }
};
const N = 'polygon(2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 2px 2px)';
function px(rows) { let d = ''; rows.forEach(function (r, y) { for (let x = 0; x < r.length; x++) { if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; } }); return d; }
const I = {
  back: px(['','','','......##','.....##','....##','...##','..############','..############','...##','....##','.....##','......##']),
  archive: px(['','','.##############','.#............#','.##############','..#..........#','..#..######..#','..#..........#','..#..........#','..#..........#','..############']),
  lever: px(['################','.##..........##','.....##','.....##','.....##','..##.##','..############','.....##########']),
  pull: px(['################','.##..........##','.....##..##','.....#.##.#','.......##','......####','.....#.##.#','.......##','.......##','......#..#','......#..#','.....##..##']),
  row: px(['','...########','....#....#','....#....#','.##.######','.##..########','........#######','............###','.............##','..............#','..............#','################']),
  curl: px(['','','..##.....##','..#########','..##..##.##','......##','......##','......##','......##.###','......########','......#########','......#########']),
  raise: px(['','.......##','.......##','##....####....##','################','##....####....##','......####','......####','......####','......#..#','......#..#','......#..#','.....##..##']),
  dip: px(['','.......##','.......##','....########','....#..##..#','....#..##..#','.####..##..####','.#.....##.....#','.#....#..#....#','.#....#..#....#','.#...##..##...#','.#............#','.#............#','###..........###']),
  pushup: px(['','','','','.##','.##','..#####','..#...#####','..#.......#####','..#...........##','..#............#','.##............#','################']),
  squat: px(['','.......##','.......##','..############','......####','......####','......####','....########','...##......##','..##........##','..##........##','...##......##','...##......##','..###......###']),
  rope: px(['','.....######','...##......##','..#....##....#','.#.....##.....#','.#...######...#','#...#.####.#...#','#..#..####..#..#','#.....####.....#','#.....#..#.....#','.#....#..#....#','..#..##..##..#','...##......##','.....######']),
  exercises: px(['','','','..##........##','.###........###','.###........###','.##############','.##############','.###........###','.###........###','..##........##'])
};
const ICON_KEYS = ['lever', 'pull', 'row', 'curl', 'raise', 'dip', 'pushup', 'squat', 'rope', 'exercises'];
const S = {
  en: {
    backAria: 'Back to exercises', title: 'EDIT EXERCISE', nameLabel: 'NAME', saves: 'Changes save as you go', name: 'Front lever + pulls', iconLabel: 'ICON',
    iconNames: ['Front lever', 'Pull-up', 'Row', 'Curl', 'Raise', 'Dip', 'Push-up', 'Squat', 'Jump rope', 'Other'],
    kindLabel: 'HOW IT IS LOGGED', kinds: ['REPS', 'PATTERN', 'SHOW ONLY'], patternLabel: 'PATTERN', pattern: '3s + {n} pulls + 3s', patternHelp: '{n} is the number you log. Shows as:', preview: '3s + 4 pulls + 3s',
    weight: 'Log weight', weightHelp: 'Off: Calisthenics programs hide the weight field for this exercise.',
    archive: 'ARCHIVE', archiveHelp: 'Used in Pull and Upper. Archiving hides it from the picker; its history and progress stay. Restore it from the Archived list.'
  },
  es: {
    backAria: 'Volver a ejercicios', title: 'EDITAR EJERCICIO', nameLabel: 'NOMBRE', saves: 'Los cambios se guardan solos', name: 'Front lever + dominadas', iconLabel: 'ÍCONO',
    iconNames: ['Front lever', 'Dominada', 'Remo', 'Curl', 'Elevación', 'Fondo', 'Flexión', 'Sentadilla', 'Soga', 'Otro'],
    kindLabel: 'CÓMO SE REGISTRA', kinds: ['REPS', 'PATRÓN', 'SIN REGISTRO'], patternLabel: 'PATRÓN', pattern: '3s + {n} dominadas + 3s', patternHelp: '{n} es el número que registras. Se ve así:', preview: '3s + 4 dominadas + 3s',
    weight: 'Registrar peso', weightHelp: 'Apagado: los programas de calistenia ocultan el peso en este ejercicio.',
    archive: 'ARCHIVAR', archiveHelp: 'Se usa en Pull y Upper. Al archivarlo sale del buscador; su historial y progreso se quedan. Lo recuperas desde Archivados.'
  }
};
class Component extends DCLogic {
  renderVals() {
    const L = this.props.lang ?? 'EN + ES';
    const pairs = L === 'EN' ? [['night', 'en'], ['day', 'en']] : L === 'ES' ? [['night', 'es'], ['day', 'es']] : [['night', 'en'], ['day', 'es']];
    function seg(t, on) { return { on: on ? 'true' : 'false', bg: on ? t.select : t.surface, fg: on ? t.onSelect : t.outline, border: on ? t.outline : t.action, shadow: on ? 'none' : 'inset 0 2px 0 ' + t.hi + ', inset 0 -4px 0 ' + t.lo }; }
    const vs = pairs.map(function (p) {
      const t = T[p[0]], s = S[p[1]];
      return {
        t: t, s: s,
        label: t.name + ' · ' + (p[1] === 'en' ? 'ENGLISH' : 'ESPAÑOL'),
        icons: ICON_KEYS.map(function (k, i) {
          const on = i === 0;
          return { d: I[k], name: s.iconNames[i], on: on ? 'true' : 'false', bg: on ? t.selBg : t.surface2, border: on ? t.selBorder : t.surface2, fg: on ? t.selText : t.outline, shadow: on ? 'none' : 'inset 0 2px 0 ' + t.hi + ', inset 0 -4px 0 ' + t.lo };
        }),
        kinds: s.kinds.map(function (l, i) { const o = seg(t, i === 1); o.label = l; return o; })
      };
    });
    return { vs: vs, n: N, ic: I };
  }
}
</script>
</body>
</html>
