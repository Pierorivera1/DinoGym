<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 900px; height: 960px; box-sizing: border-box; background: #E4E0EA; padding: 40px; display: flex; gap: 40px; font-family: Inter, sans-serif">
  <sc-for list="{{vs}}" as="v" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #3B3447">{{v.label}}</div>
      <div style="width: 390px; height: 844px; box-sizing: border-box; background: {{v.t.bg}}; color: {{v.t.outline}}; position: relative; overflow: hidden">
        <div aria-hidden="true" style="padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
          <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 22px">{{v.s.behind}}</div>
          <div style="height: 52px; background: {{v.t.surface2}}"></div>
          <div style="height: 60px; background: {{v.t.surface}}; border: 2px solid {{v.t.surface2}}"></div>
        </div>
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: {{v.t.scrim}}"></div>

        <section role="dialog" aria-label="{{v.s.title}}" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; background: {{v.t.surface}}; border-top: 2px solid {{v.t.outline}}; display: flex; flex-direction: column">
          <div style="height: 56px; flex-shrink: 0; padding: 0 8px 0 16px; display: flex; align-items: center; justify-content: space-between; background: {{v.t.titleBar}}; color: {{v.t.titleText}}; border-bottom: 2px solid {{v.t.outline}}">
            <h2 style="margin: 0; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px">{{v.s.title}}</h2>
            <button type="button" aria-label="{{v.s.closeAria}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{v.t.surface}}; border: 2px solid {{v.t.outline}}; cursor: pointer"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.close}}" fill="{{v.t.outline}}"></path></svg></button>
          </div>

          <div style="flex-grow: 1; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px">
            <p style="margin: 0; font-size: 14px; color: {{v.t.muted}}">{{v.s.scope}}</p>

            <div style="height: 56px; box-sizing: border-box; padding: 0 2px 0 12px; display: flex; align-items: center; gap: 8px; background: {{v.t.bg}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}">
              <svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.search}}" fill="{{v.t.muted}}"></path></svg>
              <input type="search" value="{{v.s.query}}" aria-label="{{v.s.searchAria}}" style="flex-grow: 1; min-width: 0; height: 48px; padding: 0; background: transparent; color: {{v.t.outline}}; border: 0; font-family: Inter, sans-serif; font-size: 16px; outline: none">
              <button type="button" aria-label="{{v.s.clearAria}}" style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.close}}" fill="{{v.t.muted}}"></path></svg></button>
            </div>

            <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.results}}</div>
            <ul style="margin: -6px 0 0; padding: 0; list-style: none; background: {{v.t.surface}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}">
              <sc-for list="{{v.rows}}" as="r" hint-placeholder-count="3">
                <li style="border-bottom: 2px dotted {{v.t.surface2}}; background: {{r.bg}}">
                  <button type="button" role="checkbox" aria-checked="{{r.checked}}" style="width: 100%; min-height: 68px; padding: 8px 12px; display: flex; align-items: center; gap: 12px; background: transparent; border: 0; color: {{v.t.outline}}; text-align: left; font-family: Inter, sans-serif; cursor: pointer">
                    <span style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{v.t.surface2}}; clip-path: {{n}}"><svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{r.icon}}" fill="{{v.t.outline}}"></path></svg></span>
                    <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                      <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
                      <span style="font-size: 13px; color: {{r.kindColor}}">{{r.kind}}</span>
                      <sc-if value="{{r.inRoutine}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; padding: 1px 6px; border: 2px solid {{v.t.muted}}; color: {{v.t.muted}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 11px">{{v.s.inRoutine}}</span></sc-if>
                    </span>
                    <span aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{r.boxBg}}; border: 2px solid {{v.t.outline}}">
                      <sc-if value="{{r.isChecked}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges"><path d="{{ic.check}}" fill="{{v.t.onSelect}}"></path></svg></sc-if>
                    </span>
                  </button>
                </li>
              </sc-for>
            </ul>

            <a href="ExerciseEdit.dc.html" style="height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; background: {{v.t.surface}}; color: {{v.t.outline}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 17px"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.plus}}" fill="{{v.t.action}}"></path></svg>{{v.s.newEx}}</a>
            <p style="margin: -4px 0 0; font-size: 13px; line-height: 1.4; color: {{v.t.muted}}">{{v.s.newHelp}}</p>

            <a href="RoutineEdit.dc.html" style="margin-top: auto; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: {{v.t.primary}}; color: {{v.t.onPrimary}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px">
              <svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.check}}" fill="{{v.t.onPrimary}}"></path></svg>{{v.s.add}}
            </a>
          </div>
        </section>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["EN + ES","EN","ES"],"default":"EN + ES"},"$preview":{"width":900,"height":960}}'>
const T = {
  night: { name: 'NIGHT', bg: '#0C0915', surface: '#1C1430', surface2: '#2A1F45', outline: '#F4F2F7', muted: '#A39BB6', primary: '#A98BFF', onPrimary: '#0C0915', select: '#F5D23A', onSelect: '#0C0915', action: '#F0A030', hi: 'rgba(255,255,255,0.22)', lo: 'rgba(0,0,0,0.45)', band: 'rgba(245,210,58,0.10)', scrim: 'rgba(12,9,21,0.78)', titleBar: '#2A1F45', titleText: '#F4F2F7' },
  day: { name: 'DAY', bg: '#FBF3E8', surface: '#FFFDF8', surface2: '#F3E6D6', outline: '#33213F', muted: '#7A6684', primary: '#6B4FC8', onPrimary: '#FBF3E8', select: '#FBDA61', onSelect: '#33213F', action: '#33213F', hi: 'rgba(255,255,255,0.6)', lo: 'rgba(51,33,63,0.25)', band: '#FBDA61', scrim: 'rgba(51,33,63,0.55)', titleBar: '#9FDCD4', titleText: '#33213F' }
};
const N = 'polygon(2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 2px 2px)';
function px(rows) { let d = ''; rows.forEach(function (r, y) { for (let x = 0; x < r.length; x++) { if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; } }); return d; }
const I = {
  check: px(['','','..............##','.............###','............###','...........###','.##........###','.###......###','..###....###','...###..###','....######','.....####','......##']),
  plus: px(['','','','','.......##','.......##','.......##','...##########','...##########','.......##','.......##','.......##']),
  close: px(['','','...##......##','....##....##','.....##..##','......####','......####','.....##..##','....##....##','...##......##']),
  search: px(['','....####','..########','.###....###','.##......##','.##......##','.##......##','.###....###','..########','....####.###','..........###','...........###','............###','.............##']),
  pull: px(['################','.##..........##','.....##..##','.....#.##.#','.......##','......####','.....#.##.#','.......##','.......##','......#..#','......#..#','.....##..##']),
  lever: px(['################','.##..........##','.....##','.....##','.....##','..##.##','..############','.....##########'])
};
const S = {
  en: {
    behind: 'EDIT ROUTINE', title: 'ADD EXERCISE', closeAria: 'Close', scope: 'Adding to the Pull routine', query: 'pull', searchAria: 'Search exercises', clearAria: 'Clear search', results: '3 RESULTS', inRoutine: 'IN ROUTINE',
    newEx: 'NEW EXERCISE “pull”', newHelp: 'Not in your library? Create it here. It comes back ticked.', add: 'ADD 1 EXERCISE',
    rows: [['lever', 'Front lever + pulls', 'Pattern: 3s + {n} pulls + 3s', true, false], ['pull', 'Neutral-grip pull-ups', 'Reps', false, true], ['pull', 'Pull-ups', 'Reps', true, false]]
  },
  es: {
    behind: 'EDITAR RUTINA', title: 'AGREGAR EJERCICIO', closeAria: 'Cerrar', scope: 'Se agrega a la rutina Pull', query: 'domin', searchAria: 'Buscar ejercicios', clearAria: 'Borrar búsqueda', results: '3 RESULTADOS', inRoutine: 'EN LA RUTINA',
    newEx: 'NUEVO EJERCICIO “domin”', newHelp: '¿No está en tu lista? Créalo aquí. Vuelve ya marcado.', add: 'AGREGAR 1 EJERCICIO',
    rows: [['pull', 'Dominadas', 'Reps', true, false], ['pull', 'Dominadas agarre neutro', 'Reps', false, true], ['lever', 'Front lever + dominadas', 'Patrón: 3s + {n} dominadas + 3s', true, false]]
  }
};
class Component extends DCLogic {
  renderVals() {
    const L = this.props.lang ?? 'EN + ES';
    const pairs = L === 'EN' ? [['night', 'en'], ['day', 'en']] : L === 'ES' ? [['night', 'es'], ['day', 'es']] : [['night', 'en'], ['day', 'es']];
    const vs = pairs.map(function (p) {
      const t = T[p[0]], s = S[p[1]];
      return {
        t: t, s: s,
        label: t.name + ' · ' + (p[1] === 'en' ? 'ENGLISH' : 'ESPAÑOL'),
        rows: s.rows.map(function (r) {
          return { icon: I[r[0]], name: r[1], kind: r[2], inRoutine: r[3], isChecked: r[4], checked: r[4] ? 'true' : 'false', bg: r[4] ? t.band : 'transparent', boxBg: r[4] ? t.select : 'transparent', kindColor: r[4] && p[0] === 'day' ? '#5A4466' : t.muted };
        })
      };
    });
    return { vs: vs, n: N, ic: I };
  }
}
</script>
</body>
</html>
