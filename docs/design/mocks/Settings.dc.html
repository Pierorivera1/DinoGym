<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 900px; height: 960px; box-sizing: border-box; background: #E4E0EA; padding: 40px; display: flex; gap: 40px; font-family: Inter, sans-serif">
  <sc-for list="{{vs}}" as="v" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #3B3447">{{v.label}}</div>
      <div style="width: 390px; height: 844px; box-sizing: border-box; background: {{v.t.bg}}; color: {{v.t.outline}}; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
        <header style="height: 56px; flex-shrink: 0; display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center">
          <a href="Home.dc.html" aria-label="{{v.s.backAria}}" style="width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{v.t.surface}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.back}}" fill="{{v.t.action}}"></path></svg></a>
          <h1 style="margin: 0; text-align: center; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 22px">{{v.s.title}}</h1>
          <span></span>
        </header>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <span id="theme-label" style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.themeLabel}}</span>
          <div role="radiogroup" aria-labelledby="theme-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{v.themes}}" as="sg" hint-placeholder-count="3">
              <button type="button" role="radio" aria-checked="{{sg.on}}" style="height: 52px; background: {{sg.bg}}; color: {{sg.fg}}; border: 2px solid {{sg.border}}; clip-path: {{n}}; box-shadow: {{sg.shadow}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer">{{sg.label}}</button>
            </sc-for>
          </div>
          <span style="font-size: 13px; line-height: 1.4; color: {{v.t.muted}}">{{v.s.themeHelp}}</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.langLabel}}</span>
          <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: {{v.t.surface}}; border: 2px solid {{v.t.surface2}}; clip-path: {{n}}">
            <span style="font-size: 15px; font-weight: 600">{{v.s.lang}}</span>
            <span style="font-size: 13px; line-height: 1.4; color: {{v.t.muted}}">{{v.s.langHelp}}</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.aboutLabel}}</span>
          <ul style="margin: 0; padding: 0; list-style: none; background: {{v.t.surface}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}">
            <li style="height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px dotted {{v.t.surface2}}; font-size: 15px">
              <span>{{v.s.version}}</span><span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 16px; color: {{v.t.muted}}">1.0.0 (1)</span>
            </li>
            <li style="border-bottom: 2px dotted {{v.t.surface2}}">
              <a href="https://github.com/Pierorivera1/DinoGym" style="height: 52px; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: {{v.t.outline}}; font-size: 15px">
                <span style="flex-grow: 1">{{v.s.source}}</span><span style="font-size: 14px; color: {{v.t.muted}}">GitHub</span>
                <svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.chevR}}" fill="{{v.t.muted}}"></path></svg>
              </a>
            </li>
            <li style="border-bottom: 2px dotted {{v.t.surface2}}">
              <a href="#" style="height: 52px; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: {{v.t.outline}}; font-size: 15px">
                <span style="flex-grow: 1">{{v.s.licences}}</span>
                <svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.chevR}}" fill="{{v.t.muted}}"></path></svg>
              </a>
            </li>
            <li style="height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
              <span>{{v.s.licence}}</span><span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 16px; color: {{v.t.muted}}">MIT</span>
            </li>
          </ul>
        </div>

        <div style="margin-top: auto; filter: drop-shadow(4px 4px 0 {{v.t.shadow}})">
          <div style="background: {{v.t.bg}}; border: 3px solid {{v.t.outline}}; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
            <img src="/_blob/302248974e46a4c504c80e111541b3ef" alt="" width="48" height="48" style="image-rendering: pixelated; flex-shrink: 0">
            <p style="margin: 0; font-size: 15px; line-height: 1.45">{{v.s.bubble}}</p>
          </div>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["EN + ES","EN","ES"],"default":"EN + ES"},"$preview":{"width":900,"height":960}}'>
const T = {
  night: { name: 'NIGHT', bg: '#0C0915', surface: '#1C1430', surface2: '#2A1F45', outline: '#F4F2F7', muted: '#A39BB6', select: '#F5D23A', onSelect: '#0C0915', action: '#F0A030', hi: 'rgba(255,255,255,0.22)', lo: 'rgba(0,0,0,0.45)', shadow: '#4A3A80' },
  day: { name: 'DAY', bg: '#FBF3E8', surface: '#FFFDF8', surface2: '#F3E6D6', outline: '#33213F', muted: '#7A6684', select: '#FBDA61', onSelect: '#33213F', action: '#33213F', hi: 'rgba(255,255,255,0.6)', lo: 'rgba(51,33,63,0.25)', shadow: '#33213F' }
};
const N = 'polygon(2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 2px 2px)';
function px(rows) { let d = ''; rows.forEach(function (r, y) { for (let x = 0; x < r.length; x++) { if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; } }); return d; }
const I = {
  back: px(['','','','......##','.....##','....##','...##','..############','..############','...##','....##','.....##','......##']),
  chevR: px(['','','.....##','.....###','......###','.......###','........###','........###','.......###','......###','.....###','.....##'])
};
const S = {
  en: {
    backAria: 'Back to home', title: 'SETTINGS', themeLabel: 'THEME', themes: ['SYSTEM', 'NIGHT', 'DAY'], themeHelp: 'System follows your phone: dark mode uses Night, light mode uses Day.',
    langLabel: 'LANGUAGE', lang: 'English', langHelp: 'DinoGym uses your phone’s language: English or Spanish. Change it in Android settings.',
    aboutLabel: 'ABOUT', version: 'Version', source: 'Source code', licences: 'Open-source licences', licence: 'Licence',
    bubble: '* DinoGym is free and open source. Your workouts stay on this phone.'
  },
  es: {
    backAria: 'Volver al inicio', title: 'AJUSTES', themeLabel: 'TEMA', themes: ['SISTEMA', 'NOCHE', 'DÍA'], themeHelp: 'Sistema sigue a tu celular: el modo oscuro usa Noche y el claro usa Día.',
    langLabel: 'IDIOMA', lang: 'Español', langHelp: 'DinoGym usa el idioma de tu celular: español o inglés. Cámbialo en los ajustes de Android.',
    aboutLabel: 'ACERCA DE', version: 'Versión', source: 'Código fuente', licences: 'Licencias de código abierto', licence: 'Licencia',
    bubble: '* DinoGym es libre y de código abierto. Tus entrenos se quedan en este celular.'
  }
};
class Component extends DCLogic {
  renderVals() {
    const L = this.props.lang ?? 'EN + ES';
    const pairs = L === 'EN' ? [['night', 'en'], ['day', 'en']] : L === 'ES' ? [['night', 'es'], ['day', 'es']] : [['night', 'en'], ['day', 'es']];
    const vs = pairs.map(function (p) {
      const t = T[p[0]], s = S[p[1]];
      return {
        t: t, s: s,
        label: t.name + ' · ' + (p[1] === 'en' ? 'ENGLISH' : 'ESPAÑOL'),
        themes: s.themes.map(function (l, i) {
          const on = i === 0;
          return { label: l, on: on ? 'true' : 'false', bg: on ? t.select : t.surface, fg: on ? t.onSelect : t.outline, border: on ? t.outline : t.action, shadow: on ? 'none' : 'inset 0 2px 0 ' + t.hi + ', inset 0 -4px 0 ' + t.lo };
        })
      };
    });
    return { vs: vs, n: N, ic: I };
  }
}
</script>
</body>
</html>
