<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Past session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 900px; height: 960px; box-sizing: border-box; background: #E4E0EA; padding: 40px; display: flex; gap: 40px; font-family: Inter, sans-serif">
  <sc-for list="{{vs}}" as="v" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #3B3447">{{v.label}}</div>
      <div style="width: 390px; height: 844px; box-sizing: border-box; background: {{v.t.bg}}; color: {{v.t.outline}}; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
        <header style="height: 56px; flex-shrink: 0; display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center">
          <a href="StatsHistory.dc.html" aria-label="{{v.s.backAria}}" style="width: 48px; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{v.t.surface}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.back}}" fill="{{v.t.action}}"></path></svg></a>
          <h1 style="margin: 0; text-align: center; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 24px">PULL</h1>
          <button type="button" aria-label="{{v.s.deleteAria}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid {{v.t.danger}}; clip-path: {{n}}; cursor: pointer"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.trash}}" fill="{{v.t.danger}}"></path></svg></button>
        </header>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: -6px">
          <span style="font-size: 14px; color: {{v.t.muted}}">{{v.s.sub}}</span>
          <span style="font-size: 13px; color: {{v.t.muted}}">{{v.s.help}}</span>
        </div>

        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{v.ex}}" as="e" hint-placeholder-count="6">
            <li style="display: flex; flex-direction: column; gap: 8px">
              <div style="min-height: 68px; box-sizing: border-box; padding: 8px 8px 8px 10px; display: flex; align-items: center; gap: 10px; background: {{v.t.surface}}; border: 2px solid {{v.t.surface2}}; clip-path: {{n}}">
                <a href="Progress.dc.html" aria-label="{{e.progressAria}}" style="flex-grow: 1; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: {{v.t.outline}}">
                  <span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{v.t.surface2}}; clip-path: {{n}}"><svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{e.icon}}" fill="{{v.t.outline}}"></path></svg></span>
                  <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 14px; font-weight: 600; line-height: 1.25">{{e.name}}</span>
                    <sc-if value="{{e.hasNote}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: {{v.t.muted}}">{{e.note}}</span></sc-if>
                  </span>
                </a>
                <div style="display: flex; gap: 4px; flex-shrink: 0">
                  <sc-for list="{{e.sets}}" as="c" hint-placeholder-count="3">
                    <button type="button" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" style="width: 48px; height: 52px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}; clip-path: {{n}}; cursor: pointer">
                      <span style="font-family: Inter, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: {{c.labelColor}}">{{c.label}}</span>
                      <span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px; line-height: 1">{{c.reps}}<span style="font-size: 12px; color: {{v.t.success}}">{{c.up}}</span></span>
                    </button>
                  </sc-for>
                </div>
              </div>
              <sc-if value="{{e.editing}}" hint-placeholder-val="{{false}}">
                <div style="filter: drop-shadow(4px 4px 0 {{v.t.shadow}}); margin: 0 4px 6px 0">
                  <div style="background: {{v.t.selBg}}; color: {{v.t.selText}}; border: 2px solid {{v.t.selBorder}}; clip-path: {{n}}; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
                    <svg viewBox="0 0 8 8" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{cur.y}}" fill="#F5D23A"></path><path d="{{cur.o}}" fill="#33213F"></path></svg>
                    <span style="flex-grow: 1; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 16px">{{v.s.editing}}</span>
                    <button type="button" aria-label="{{v.s.lessAria}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{v.t.surface}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; cursor: pointer"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.minus}}" fill="{{v.t.outline}}"></path></svg></button>
                    <span style="width: 44px; text-align: center; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 34px; line-height: 1; color: {{v.t.outline}}">6</span>
                    <button type="button" aria-label="{{v.s.moreAria}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{v.t.surface}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; cursor: pointer"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.plus}}" fill="{{v.t.outline}}"></path></svg></button>
                  </div>
                </div>
              </sc-if>
            </li>
          </sc-for>
        </ul>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["EN + ES","EN","ES"],"default":"EN + ES"},"$preview":{"width":900,"height":960}}'>
const T = {
  night: { name: 'NIGHT', bg: '#0C0915', surface: '#1C1430', surface2: '#2A1F45', outline: '#F4F2F7', muted: '#A39BB6', select: '#F5D23A', onSelect: '#0C0915', action: '#F0A030', danger: '#FF4D4D', success: '#5CD27A', hi: 'rgba(255,255,255,0.22)', lo: 'rgba(0,0,0,0.45)', shadow: '#4A3A80', selBg: '#1C1430', selBorder: '#F5D23A', selText: '#F5D23A', activeMuted: '#A39BB6' },
  day: { name: 'DAY', bg: '#FBF3E8', surface: '#FFFDF8', surface2: '#F3E6D6', outline: '#33213F', muted: '#7A6684', select: '#FBDA61', onSelect: '#33213F', action: '#33213F', danger: '#B8326A', success: '#2F7D45', hi: 'rgba(255,255,255,0.6)', lo: 'rgba(51,33,63,0.25)', shadow: '#33213F', selBg: '#FBDA61', selBorder: '#33213F', selText: '#33213F', activeMuted: '#5A4466' }
};
const N = 'polygon(2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 2px 2px)';
function px(rows) { let d = ''; rows.forEach(function (r, y) { for (let x = 0; x < r.length; x++) { if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; } }); return d; }
const I = {
  plus: px(['','','','','.......##','.......##','.......##','...##########','...##########','.......##','.......##','.......##']),
  minus: px(['','','','','','','','...##########','...##########']),
  back: px(['','','','......##','.....##','....##','...##','..############','..############','...##','....##','.....##','......##']),
  trash: px(['','......####','.....#....#','..############','..############','...#........#','...#.##..##.#','...#.##..##.#','...#.##..##.#','...#.##..##.#','...#........#','...##########']),
  pull: px(['################','.##..........##','.....##..##','.....#.##.#','.......##','......####','.....#.##.#','.......##','.......##','......#..#','......#..#','.....##..##']),
  lever: px(['################','.##..........##','.....##','.....##','.....##','..##.##','..############','.....##########']),
  curl: px(['','','..##.....##','..#########','..##..##.##','......##','......##','......##','......##.###','......########','......#########','......#########']),
  row: px(['','...########','....#....#','....#....#','.##.######','.##..########','........#######','............###','.............##','..............#','..............#','################'])
};
const CUR_O = px(['..####..', '.#....#.', '#......#', '#.#..#.#', '#......#', '#..##..#', '.#....#.', '..####..']);
const CUR_Y = px(['........', '..####..', '.######.', '.#.##.#.', '.######.', '.##..##.', '..####..', '........']);
const EX = [['lever', [4, 4], ''], ['curl', [13, 13, 13], ''], ['pull', [7, 6], 'best'], ['curl', [25, 25], ''], ['row', [12, 12, 12], ''], ['curl', [12, 12], '']];
const S = {
  en: {
    backAria: 'Back to history', deleteAria: 'Delete this workout', sub: 'Mon 16 Nov · 42:10 · 14 sets', help: 'Tap a set to change it. Tap a name for its progress.',
    names: ['Front lever + pulls', 'Forearm curl', 'Pull-ups', 'Reverse curl', 'Rows', 'Bicep curl'], notes: ['3s + {n} pulls + 3s', '', '▲ New best on set 1', '', '', ''],
    set: 'SET ', reps: ' reps', setAria: 'Set ', progress: 'Progress for ', editing: 'SET 2 OF 2', lessAria: 'One less rep', moreAria: 'One more rep'
  },
  es: {
    backAria: 'Volver al historial', deleteAria: 'Borrar este entreno', sub: 'lun 16 nov · 42:10 · 14 series', help: 'Toca una serie para cambiarla. Toca un nombre para ver su progreso.',
    names: ['Front lever + dominadas', 'Curl de antebrazo', 'Dominadas', 'Curl inverso', 'Remo', 'Curl de bíceps'], notes: ['3s + {n} dominadas + 3s', '', '▲ Récord en la serie 1', '', '', ''],
    set: 'S', reps: ' reps', setAria: 'Serie ', progress: 'Progreso de ', editing: 'SERIE 2 DE 2', lessAria: 'Una repetición menos', moreAria: 'Una repetición más'
  }
};
class Component extends DCLogic {
  renderVals() {
    const L = this.props.lang ?? 'EN + ES';
    const pairs = L === 'EN' ? [['night', 'en'], ['day', 'en']] : L === 'ES' ? [['night', 'es'], ['day', 'es']] : [['night', 'en'], ['day', 'es']];
    const vs = pairs.map(function (p) {
      const t = T[p[0]], s = S[p[1]];
      return {
        t: t, s: s,
        label: t.name + ' · ' + (p[1] === 'en' ? 'ENGLISH' : 'ESPAÑOL'),
        ex: EX.map(function (e, i) {
          const editing = i === 2;
          return {
            icon: I[e[0]], name: s.names[i], note: s.notes[i], hasNote: s.notes[i] !== '', editing: editing, progressAria: s.progress + s.names[i],
            sets: e[1].map(function (r, j) {
              const sel = editing && j === 1, best = e[2] === 'best' && j === 0;
              return { label: (p[1] === 'en' ? 'SET ' : 'S') + (j + 1), reps: sel ? 6 : r, up: best ? '▲' : '', pressed: sel ? 'true' : 'false', aria: s.setAria + (j + 1) + ', ' + r + s.reps, bg: sel ? t.selBg : t.bg, fg: sel ? t.selText : t.outline, border: sel ? t.selBorder : t.outline, labelColor: sel ? t.activeMuted : t.muted };
            })
          };
        })
      };
    });
    return { vs: vs, n: N, ic: I, cur: { o: CUR_O, y: CUR_Y } };
  }
}
</script>
</body>
</html>
