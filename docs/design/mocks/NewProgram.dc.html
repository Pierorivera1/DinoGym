<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New program</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 900px; height: 960px; box-sizing: border-box; background: #E4E0EA; padding: 40px; display: flex; gap: 40px; font-family: Inter, sans-serif">
  <sc-for list="{{vs}}" as="v" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #3B3447">{{v.label}}</div>
      <div style="width: 390px; height: 844px; box-sizing: border-box; background: {{v.t.bg}}; color: {{v.t.outline}}; position: relative; overflow: hidden">
        <div aria-hidden="true" style="padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
          <div style="height: 56px; display: flex; align-items: center; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 26px">{{v.s.behind}}</div>
          <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.section}}<span style="height: 48px; padding: 0 14px; display: flex; align-items: center; border: 2px solid {{v.t.action}}; font-family: 'Pixelify Sans', sans-serif; font-size: 17px; color: {{v.t.outline}}">+ {{v.s.new}}</span></div>
        </div>
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: {{v.t.scrim}}"></div>

        <section role="dialog" aria-label="{{v.s.title}}" style="position: absolute; left: 0; right: 0; top: 120px; bottom: 0; background: {{v.t.surface}}; border-top: 2px solid {{v.t.outline}}; display: flex; flex-direction: column">
          <div style="height: 56px; flex-shrink: 0; padding: 0 8px 0 16px; display: flex; align-items: center; justify-content: space-between; background: {{v.t.titleBar}}; color: {{v.t.titleText}}; border-bottom: 2px solid {{v.t.outline}}">
            <h2 style="margin: 0; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px">{{v.s.title}}</h2>
            <button type="button" aria-label="{{v.s.closeAria}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{v.t.surface}}; border: 2px solid {{v.t.outline}}; cursor: pointer"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.close}}" fill="{{v.t.outline}}"></path></svg></button>
          </div>

          <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 10px">
            <p style="margin: 0; font-size: 13px; line-height: 1.4; color: {{v.t.muted}}">{{v.s.help}}</p>

            <a href="ProgramEdit.dc.html" style="min-height: 64px; box-sizing: border-box; padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 10px; text-decoration: none; background: {{v.t.surface}}; color: {{v.t.outline}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}">
              <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 18px">{{v.s.empty}}</span><span style="font-size: 13px; color: {{v.t.muted}}">{{v.s.emptyMeta}}</span></span>
              <svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.chevron}}" fill="{{v.t.outline}}"></path></svg>
            </a>

            <div style="margin-top: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: {{v.t.muted}}">{{v.s.ready}}</div>
            <sc-for list="{{v.cards}}" as="c" hint-placeholder-count="3">
              <a href="ProgramEdit.dc.html" style="box-sizing: border-box; padding: 12px 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; background: {{v.t.surface}}; color: {{v.t.outline}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}">
                <span style="display: flex; align-items: center; gap: 10px">
                  <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px">{{c.name}}</span><span style="font-size: 13px; color: {{v.t.muted}}">{{c.meta}}</span></span>
                  <svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.plus}}" fill="{{v.t.outline}}"></path></svg>
                </span>
                <span style="display: flex; gap: 4px">
                  <sc-for list="{{c.steps}}" as="st" hint-placeholder-count="7">
                    <span style="flex: 1; height: 32px; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid {{v.t.surface2}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 10px; white-space: nowrap; color: {{st.color}}">{{st.label}}</span>
                  </sc-for>
                </span>
              </a>
            </sc-for>
            <p style="margin: 0; font-size: 13px; line-height: 1.4; color: {{v.t.muted}}">{{v.s.source}}</p>
          </div>
        </section>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["EN + ES","EN","ES"],"default":"EN + ES"},"$preview":{"width":900,"height":960}}'>
const T = {
  night: { name: 'NIGHT', bg: '#0C0915', surface: '#1C1430', surface2: '#2A1F45', outline: '#F4F2F7', muted: '#A39BB6', primary: '#A98BFF', onPrimary: '#0C0915', select: '#F5D23A', onSelect: '#0C0915', action: '#F0A030', hi: 'rgba(255,255,255,0.22)', lo: 'rgba(0,0,0,0.45)', band: 'rgba(245,210,58,0.10)', scrim: 'rgba(12,9,21,0.78)', titleBar: '#2A1F45', titleText: '#F4F2F7' },
  day: { name: 'DAY', bg: '#FBF3E8', surface: '#FFFDF8', surface2: '#F3E6D6', outline: '#33213F', muted: '#7A6684', primary: '#6B4FC8', onPrimary: '#FBF3E8', select: '#FBDA61', onSelect: '#33213F', action: '#33213F', hi: 'rgba(255,255,255,0.6)', lo: 'rgba(51,33,63,0.25)', band: '#FBDA61', scrim: 'rgba(51,33,63,0.55)', titleBar: '#9FDCD4', titleText: '#33213F' }
};
const N = 'polygon(2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 2px 2px)';
function px(rows) { let d = ''; rows.forEach(function (r, y) { for (let x = 0; x < r.length; x++) { if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; } }); return d; }
const I = {
  plus: px(['','','','','.......##','.......##','.......##','...##########','...##########','.......##','.......##','.......##']),
  close: px(['','','...##......##','....##....##','.....##..##','......####','......####','.....##..##','....##....##','...##......##']),
  chevron: px(['','','','.....##','......##','.......##','........##','.........##','........##','.......##','......##','.....##'])
};
const S = {
  en: {
    behind: 'PROGRAMS', section: 'YOUR PROGRAMS', new: 'NEW', title: 'NEW PROGRAM', closeAria: 'Close',
    help: 'Start from a ready-made program and change anything later, or build your own.',
    empty: 'EMPTY PROGRAM', emptyMeta: 'Pick your routines and rest days', ready: 'READY-MADE',
    source: "Based on Jeff Nippard's free advice. The calisthenics programs apply the same principles to bodyweight exercises.",
    rest: 'ZZZ', ul: ['UPPER', 'LOWER'], ppl: ['PUSH', 'PULL', 'LEGS'],
    cards: [['GYM · 5 DAYS', '5 routines · 22 exercises', 5], ['CALISTHENICS · 5 DAYS', '5 routines · 17 exercises', 5], ['GYM · 4 DAYS', '2 routines · 10 exercises', 4]]
  },
  es: {
    behind: 'PROGRAMAS', section: 'TUS PROGRAMAS', new: 'NUEVO', title: 'PROGRAMA NUEVO', closeAria: 'Cerrar',
    help: 'Empieza con un programa listo y cámbialo cuando quieras, o arma el tuyo.',
    empty: 'PROGRAMA VACÍO', emptyMeta: 'Elige tus rutinas y días de descanso', ready: 'LISTOS PARA USAR',
    source: 'Basado en los consejos gratuitos de Jeff Nippard. Los programas de calistenia aplican los mismos principios a ejercicios con el peso corporal.',
    rest: 'ZZZ', ul: ['TREN SUP.', 'TREN INF.'], ppl: ['EMPUJE', 'TIRÓN', 'PIERNA'],
    cards: [['GYM · 5 DÍAS', '5 rutinas · 22 ejercicios', 5], ['CALISTENIA · 5 DÍAS', '5 rutinas · 17 ejercicios', 5], ['GYM · 4 DÍAS', '2 rutinas · 10 ejercicios', 4]]
  }
};
class Component extends DCLogic {
  renderVals() {
    const L = this.props.lang ?? 'EN + ES';
    const pairs = L === 'EN' ? [['night', 'en'], ['day', 'en']] : L === 'ES' ? [['night', 'es'], ['day', 'es']] : [['night', 'en'], ['day', 'es']];
    const vs = pairs.map(function (p) {
      const t = T[p[0]], s = S[p[1]];
      const R = null;
      function cycle(days) {
        const c = days === 5 ? [s.ul[0], s.ul[1], R, s.ppl[0], s.ppl[1], s.ppl[2], R] : [s.ul[0], s.ul[1], R, s.ul[0], s.ul[1], R, R];
        return c.map(function (x) { return { label: x || s.rest, color: x ? t.outline : t.muted }; });
      }
      return {
        t: t, s: s,
        label: t.name + ' · ' + (p[1] === 'en' ? 'ENGLISH' : 'ESPAÑOL'),
        cards: s.cards.map(function (c) { return { name: c[0], meta: c[1], steps: cycle(c[2]) }; })
      };
    });
    return { vs: vs, n: N, ic: I };
  }
}
</script>
</body>
</html>
