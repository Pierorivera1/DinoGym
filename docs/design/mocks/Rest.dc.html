<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rest timer screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 900px; height: 960px; box-sizing: border-box; background: #E4E0EA; padding: 40px; display: flex; gap: 40px; font-family: Inter, sans-serif">
  <sc-for list="{{vs}}" as="v" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #3B3447">{{v.label}}</div>
      <div style="width: 390px; height: 844px; box-sizing: border-box; background: {{v.t.bg}}; color: {{v.t.outline}}; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
        <header style="height: 56px; display: grid; grid-template-columns: 48px 1fr 64px; align-items: center">
          <button type="button" aria-label="{{v.s.endAria}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid {{v.t.danger}}; clip-path: {{n}}; cursor: pointer"><svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.close}}" fill="{{v.t.danger}}"></path></svg></button>
          <span style="text-align: center; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 24px">PULL</span>
          <span style="text-align: right; font-family: 'Pixelify Sans', sans-serif; font-weight: 500; font-size: 18px; color: {{v.t.muted}}">19:10</span>
        </header>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 12px">
          <h1 style="margin: 0; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 28px; color: {{v.t.muted}}; letter-spacing: 0.04em">{{v.s.rest}}</h1>
          <div role="timer" aria-label="{{v.s.timerAria}}" style="font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 104px; line-height: 1">01:48</div>
          <div style="display: flex; gap: 4px; width: 100%">
            <sc-for list="{{v.bar}}" as="b" hint-placeholder-count="10"><div style="flex-grow: 1; height: 20px; background: {{b.c}}; border: 2px solid {{v.t.outline}}"></div></sc-for>
          </div>
          <span style="font-size: 14px; color: {{v.t.muted}}">{{v.s.of}}</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="height: 56px; background: {{v.t.surface}}; color: {{v.t.outline}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer">−15s</button>
          <button type="button" style="height: 56px; background: {{v.t.surface}}; color: {{v.t.outline}}; border: 2px solid {{v.t.action}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer">+15s</button>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; align-items: flex-end; gap: 12px">
            <img src="/_blob/302248974e46a4c504c80e111541b3ef" alt="" width="96" height="96" style="image-rendering: pixelated; flex-shrink: 0">
            <div style="flex-grow: 1; filter: drop-shadow(4px 4px 0 {{v.t.shadow}})">
              <div style="background: {{v.t.bg}}; border: 3px solid {{v.t.outline}}; padding: 12px 14px">
                <p style="margin: 0; font-size: 15px; line-height: 1.45">{{v.s.bubble}}</p>
              </div>
            </div>
          </div>
          <button type="button" style="height: 64px; display: flex; align-items: center; justify-content: center; gap: 10px; background: {{v.t.primary}}; color: {{v.t.onPrimary}}; border: 2px solid {{v.t.outline}}; clip-path: {{n}}; box-shadow: inset 0 2px 0 {{v.t.hi}}, inset 0 -4px 0 {{v.t.lo}}; font-family: 'Pixelify Sans', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer">
            <svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ic.skip}}" fill="{{v.t.onPrimary}}"></path></svg>{{v.s.skip}}
          </button>
          <p style="margin: 0; text-align: center; font-size: 13px; color: {{v.t.muted}}">{{v.s.bg}}</p>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["EN + ES","EN","ES"],"default":"EN + ES"},"$preview":{"width":900,"height":960}}'>
const T = {
  night: { name: 'NIGHT', bg: '#0C0915', surface: '#1C1430', outline: '#F4F2F7', muted: '#A39BB6', primary: '#A98BFF', onPrimary: '#0C0915', action: '#F0A030', danger: '#FF4D4D', hi: 'rgba(255,255,255,0.22)', lo: 'rgba(0,0,0,0.45)', shadow: '#4A3A80' },
  day: { name: 'DAY', bg: '#FBF3E8', surface: '#FFFDF8', outline: '#33213F', muted: '#7A6684', primary: '#6B4FC8', onPrimary: '#FBF3E8', action: '#33213F', danger: '#B8326A', hi: 'rgba(255,255,255,0.6)', lo: 'rgba(51,33,63,0.25)', shadow: '#33213F' }
};
const N = 'polygon(2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 2px 2px)';
function px(rows) { let d = ''; rows.forEach(function (r, y) { for (let x = 0; x < r.length; x++) { if (r[x] === '#') d += 'M' + x + ' ' + y + 'h1v1h-1z'; } }); return d; }
const I = {
  close: px(['','','...##......##','....##....##','.....##..##','......####','......####','.....##..##','....##....##','...##......##']),
  skip: px(['','','','..#....#....##','..##...##...##','..###..###..##','..####.####.##','..###..###..##','..##...##...##','..#....#....##'])
};
const S = {
  en: { endAria: 'End workout', rest: 'REST', timerAria: '1 minute 48 seconds of rest left', of: 'of 2:30 · set 1 of Pull-ups done', bubble: '* Breathe. Up next: pull-ups, set 2 of 2.', skip: 'SKIP REST', bg: 'The timer keeps running with the screen off.' },
  es: { endAria: 'Terminar entreno', rest: 'DESCANSO', timerAria: 'Quedan 1 minuto 48 segundos de descanso', of: 'de 2:30 · serie 1 de dominadas hecha', bubble: '* Respira. Sigue: dominadas, serie 2 de 2.', skip: 'SALTAR DESCANSO', bg: 'El temporizador sigue con la pantalla apagada.' }
};
class Component extends DCLogic {
  renderVals() {
    const L = this.props.lang ?? 'EN + ES';
    const pairs = L === 'EN' ? [['night', 'en'], ['day', 'en']] : L === 'ES' ? [['night', 'es'], ['day', 'es']] : [['night', 'en'], ['day', 'es']];
    const vs = pairs.map(function (p) {
      const t = T[p[0]];
      const bar = [];
      for (let i = 0; i < 10; i++) bar.push({ c: i < 7 ? t.primary : 'transparent' });
      return { t: t, s: S[p[1]], bar: bar, label: t.name + ' · ' + (p[1] === 'en' ? 'ENGLISH' : 'ESPAÑOL') };
    });
    return { vs: vs, n: N, ic: I };
  }
}
</script>
</body>
</html>
