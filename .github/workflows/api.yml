# Checks the API contract and the Go code generated from it (decision 60).
# The Kotlin client generated from the same file is built and tested in android.yml.
name: API

on:
  push:
    paths:
      - "api/**"
      - "backend/**"
      - ".github/workflows/api.yml"

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Lint the contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Pinned to a release at least a week old (decision 61).
      - name: Lint api/openapi.yaml
        run: npx --yes @redocly/cli@2.76.0 lint --config api/redocly.yaml api/openapi.yaml

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The generated server is committed. Regenerating must change nothing, or
      # someone edited the contract without running `go generate`.
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- .

      # Also vets the emulator tests, which run in infra.yml.
      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Test
        run: go test -p 2 ./...

      # The Lambda binaries (decisions 63 and 107). Built only to prove they compile; deploy.yml builds and deploys them.
      - name: Build the Lambda binaries
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bootstrap ./cmd/api
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bootstrap-reminders ./cmd/reminders
