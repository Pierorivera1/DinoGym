# Builds the Android app, runs its unit tests and lint on every push.
name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # Gradle itself runs on the JDK pinned in gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle downloads and build outputs between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  # Database and UI tests need a real Android runtime. They run only here, on an
  # emulator, never on the laptop (CLAUDE.md "Do not overheat the laptop").
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the emulator, as in android-emulator-runner's README.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload androidTest report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
