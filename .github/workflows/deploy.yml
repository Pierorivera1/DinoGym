# Deploys the backend and the web side from main: staging first, then prod
# after a person approves (docs/WORKFLOW.md, stages 3 and 4). The Lambda zip and
# the web dashboard are built once, so prod runs exactly what passed staging's
# smoke tests.
#
# AWS access is OIDC only (infra/bootstrap): each job asks GitHub for a token
# and swaps it for an hour of credentials on its environment's deploy role.
#
# Off until task 19 creates the AWS side. Every job checks the repository
# variable DEPLOY_ENABLED, so pushes skip cleanly instead of failing. A
# repository variable is used because a job's `if` cannot see environment
# variables: those load only once the job has started in its environment.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "backend/**"
      - "infra/**"
      # The shared link page, and the app font it serves (infra/modules/dinogym/web.tf).
      - "web/**"
      - "android/app/src/main/res/font/pixelify_sans.ttf"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same emulator checks as a pull request. main has no branch protection,
  # so a merge does not prove they passed; running them here means nothing
  # reaches AWS without them.
  checks:
    name: Emulator checks
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/infra.yml

  build:
    name: Build the Lambda zip and the dashboard
    needs: checks
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Reproducible zip (decision 66), so an unchanged commit plans no change.
      - name: Build
        run: infra/scripts/build-lambda.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/dashboard/.nvmrc
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      # web.tf uploads web/dashboard/dist (decision 116).
      - name: Build the web dashboard
        working-directory: web/dashboard
        run: npm ci --no-audit --no-fund && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: lambda-zip
          path: |
            backend/bin/api.zip
            backend/bin/reminders.zip
          if-no-files-found: error
          # Must outlive the wait for prod's approval, which GitHub caps at 30 days.
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: web-dashboard
          path: web/dashboard/dist
          if-no-files-found: error
          retention-days: 30

  staging:
    name: Staging
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds AWS_DEPLOY_ROLE_ARN, and is the `sub` the staging role trusts.
    environment: staging
    # One deploy per environment at a time. Never cancel one in progress: a
    # Terraform apply stopped halfway leaves a held lock and half-made resources.
    # A newer run waits; if a third arrives, it replaces the one waiting.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      id-token: write # ask GitHub for the OIDC token
      contents: read
    defaults:
      run:
        working-directory: infra/envs/staging
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lambda-zip
          path: backend/bin

      - uses: actions/download-artifact@v8
        with:
          name: web-dashboard
          path: web/dashboard/dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2 # decision 18
          # Plain terraform, so `terraform output -raw` prints only the value.
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Apply exactly the plan that was printed, not a second, fresh one.
      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false tfplan

      # The emulator cannot run the Go Lambda or route API Gateway to it
      # (docs/WORKFLOW.md), so this is the first real proof of that path.
      - name: Smoke test
        run: |
          url="$(terraform output -raw api_url)"
          url="${url%/}/health"
          for try in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            echo "try $try: $url -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$url did not answer 200"
          exit 1

      # The shared-link side through real CloudFront (decision 101): the page,
      # assetlinks.json from S3 through origin access control, and the API
      # answering through the /shares/* behaviour (a made-up id is a 404 from
      # the Lambda, not a 403 from CloudFront or S3).
      - name: Smoke test the shared links
        run: |
          web="$(terraform output -raw web_url)"
          id=AAAAAAAAAAAAAAAAAAAAAA
          check() { # check <path> <expected status> <grep pattern in body>
            for try in 1 2 3 4 5 6; do
              code="$(curl -s -o body.txt -w '%{http_code}' --max-time 10 "$web$1" || true)"
              echo "try $try: $web$1 -> $code"
              if [ "$code" = "$2" ] && grep -q "$3" body.txt; then return 0; fi
              sleep 10
            done
            echo "::error::$web$1 did not answer $2 with $3"
            exit 1
          }
          check "/r/$id" 200 'data-package='
          check "/.well-known/assetlinks.json" 200 'package_name'
          check "/shares/$id" 404 '"not_found"'

      # The web dashboard through real CloudFront: its addresses serve the page,
      # its script loads, and /sync/* reaches the Lambda (no token is a 401
      # from the API, not a 403 from CloudFront or S3).
      - name: Smoke test the web dashboard
        run: |
          web="$(terraform output -raw web_url)"
          check() { # check <path> <expected status> <grep pattern in body>
            for try in 1 2 3 4 5 6; do
              code="$(curl -s -o body.txt -w '%{http_code}' --max-time 10 "$web$1" || true)"
              echo "try $try: $web$1 -> $code"
              if [ "$code" = "$2" ] && grep -q "$3" body.txt; then return 0; fi
              sleep 10
            done
            echo "::error::$web$1 did not answer $2 with $3"
            exit 1
          }
          check "/" 200 '<div id="root">'
          check "/history/2026-11-16" 200 '<div id="root">'
          script="$(grep -o '/app/assets/[^"]*\.js' body.txt | head -1)"
          check "$script" 200 'accounts.google.com\|createRoot\|react'
          check "/sync/pull?since=0" 401 '"invalid_token"'

  prod:
    name: Prod
    needs: staging
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The approval gate: the prod environment requires a reviewer, so this job
    # waits for the owner before it gets the token the prod role trusts.
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/envs/prod
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7

      # The same zip staging deployed and tested.
      - uses: actions/download-artifact@v8
        with:
          name: lambda-zip
          path: backend/bin

      - uses: actions/download-artifact@v8
        with:
          name: web-dashboard
          path: web/dashboard/dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false tfplan

      - name: Smoke test
        run: |
          url="$(terraform output -raw api_url)"
          url="${url%/}/health"
          for try in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            echo "try $try: $url -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$url did not answer 200"
          exit 1

      # The shared-link side through real CloudFront (decision 101): the page,
      # assetlinks.json from S3 through origin access control, and the API
      # answering through the /shares/* behaviour (a made-up id is a 404 from
      # the Lambda, not a 403 from CloudFront or S3).
      - name: Smoke test the shared links
        run: |
          web="$(terraform output -raw web_url)"
          id=AAAAAAAAAAAAAAAAAAAAAA
          check() { # check <path> <expected status> <grep pattern in body>
            for try in 1 2 3 4 5 6; do
              code="$(curl -s -o body.txt -w '%{http_code}' --max-time 10 "$web$1" || true)"
              echo "try $try: $web$1 -> $code"
              if [ "$code" = "$2" ] && grep -q "$3" body.txt; then return 0; fi
              sleep 10
            done
            echo "::error::$web$1 did not answer $2 with $3"
            exit 1
          }
          check "/r/$id" 200 'data-package='
          check "/.well-known/assetlinks.json" 200 'package_name'
          check "/shares/$id" 404 '"not_found"'

      # The web dashboard through real CloudFront: its addresses serve the page,
      # its script loads, and /sync/* reaches the Lambda (no token is a 401
      # from the API, not a 403 from CloudFront or S3).
      - name: Smoke test the web dashboard
        run: |
          web="$(terraform output -raw web_url)"
          check() { # check <path> <expected status> <grep pattern in body>
            for try in 1 2 3 4 5 6; do
              code="$(curl -s -o body.txt -w '%{http_code}' --max-time 10 "$web$1" || true)"
              echo "try $try: $web$1 -> $code"
              if [ "$code" = "$2" ] && grep -q "$3" body.txt; then return 0; fi
              sleep 10
            done
            echo "::error::$web$1 did not answer $2 with $3"
            exit 1
          }
          check "/" 200 '<div id="root">'
          check "/history/2026-11-16" 200 '<div id="root">'
          script="$(grep -o '/app/assets/[^"]*\.js' body.txt | head -1)"
          check "$script" 200 'accounts.google.com\|createRoot\|react'
          check "/sync/pull?since=0" 401 '"invalid_token"'
